name: Build Android APK

# The Android build needs the NDK, CMake and a large Gradle dependency tree.
# Running it here rather than on a local machine keeps the port reproducible
# and means a plain `git push` is enough to get a new APK.

on:
  push:
    branches: [main]
    tags: ['V*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  NDK_VERSION: 27.0.12077973
  NDK_DIR: android-ndk-r27

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK is set up by hand rather than with setup-android: that
      # action has been unreliable with the very new AGP/Gradle versions this
      # project needs. The command line tools are fetched straight from
      # Google, which is what setup-android does under the hood anyway.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          cmdline_version="11076708"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${cmdline_version}_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses > /dev/null || true

      # The NDK is a ~660MB archive. sdkmanager's own downloader truncates it
      # often enough to break the build, so it is fetched with curl (which
      # resumes) and unpacked by hand. The unpack is verified afterwards:
      # without a valid source.properties the SDK manager considers the NDK
      # directory malformed and the build fails much later with a confusing
      # "Invalid format" error.
      - name: Install the NDK
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          URL="https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          ZIP=/tmp/android-ndk.zip

          for attempt in 1 2 3 4 5 6; do
            echo "NDK download attempt $attempt"
            curl -fL --retry 3 --retry-all-errors -C - -o "$ZIP" "$URL" || true
            if unzip -tq "$ZIP" > /dev/null 2>&1; then
              echo "NDK archive verified"
              break
            fi
            echo "NDK archive incomplete, retrying"
            rm -f "$ZIP"
          done

          unzip -tq "$ZIP" > /dev/null

          rm -rf /tmp/ndk-unpack
          mkdir -p /tmp/ndk-unpack
          unzip -q "$ZIP" -d /tmp/ndk-unpack
          rm -f "$ZIP"

          mkdir -p "$SDK_ROOT/ndk"
          rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
          mv "/tmp/ndk-unpack/$NDK_DIR" "$SDK_ROOT/ndk/$NDK_VERSION"
          rm -rf /tmp/ndk-unpack

          # The SDK manager identifies an NDK by its source.properties; if
          # that file is missing the directory is rejected as malformed.
          if [ ! -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
            echo "::error::NDK source.properties missing after unpack"
            ls -la "$SDK_ROOT/ndk/$NDK_VERSION" | head -20
            exit 1
          fi
          cat "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"
          echo "Installed NDK at $SDK_ROOT/ndk/$NDK_VERSION"

      - name: Install the remaining SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"
          {
            echo "### Installed SDK packages"
            sdkmanager --list_installed
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Checkout Butterscotch (the GameMaker runner this port builds on)
        uses: actions/checkout@v4
        with:
          repository: ButterscotchRunner/Butterscotch
          path: vendor/Butterscotch

      - name: Apply FrickBears 3 port patches
        run: |
          set -euo pipefail
          python3 port/scripts/apply_port.py vendor/Butterscotch | tee -a "$GITHUB_STEP_SUMMARY"
          python3 port/scripts/apply_game_screen.py vendor/Butterscotch | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build debug + release APK
        working-directory: vendor/Butterscotch/src/android/frontend
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/27.0.12077973
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee /tmp/gradle.log
          # Surface the interesting bits in the run summary so a failure is
          # diagnosable without digging through the full log.
          {
            echo "### Gradle"
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|Could not|A problem occurred" /tmp/gradle.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APKs
        run: |
          mkdir -p dist
          find vendor/Butterscotch/src/android/frontend/app/build/outputs/apk \
            -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/
          ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"

      # Always ship the logs, even on failure, so a broken build can be
      # diagnosed from the artifacts without re-running it.
      - name: Upload build logs
        if: always()
        run: |
          mkdir -p dist-logs
          cp /tmp/gradle.log dist-logs/gradle.log 2>/dev/null || echo "no gradle log captured" > dist-logs/gradle.log
          ls -la dist-logs

      - name: Upload build logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: dist-logs/
          if-no-files-found: ignore

      - name: Publish the logs to a branch
        # The artifacts are only downloadable by signed-in users, which makes
        # them awkward to read from a bot or a CI-less machine. Pushing the
        # log to a branch keeps it fetchable with plain `git`.
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: logs-repo
        run: |
          cd logs-repo
          mkdir -p build-logs
          cp ../dist-logs/gradle.log build-logs/gradle.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A build-logs
          git commit -m "build logs: ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push origin HEAD:refs/heads/build-logs || echo "could not push logs"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frickbears3-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
