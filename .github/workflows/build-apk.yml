name: Build Android APK

# The Android build needs the NDK, CMake and a large Gradle dependency tree.
# Running it here rather than on a local machine keeps the port reproducible
# and means a plain `git push` is enough to get a new APK.

on:
  push:
    branches: [main]
    tags: ['V*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" \
                    "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Checkout Butterscotch (the GameMaker runner this port builds on)
        uses: actions/checkout@v4
        with:
          repository: ButterscotchRunner/Butterscotch
          path: vendor/Butterscotch

      - name: Apply FrickBears 3 port patches
        run: |
          python3 scripts/apply_port.py vendor/Butterscotch
          python3 scripts/apply_game_screen.py vendor/Butterscotch

      - name: Build debug + release APK
        working-directory: vendor/Butterscotch/src/android/frontend
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          find vendor/Butterscotch/src/android/frontend/app/build/outputs/apk \
            -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frickbears3-android-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
